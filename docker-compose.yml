services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: persona                       # base créée automatiquement au 1er démarrage
    volumes:
      - pgdata:/var/lib/postgresql/data          # données persistantes
      # Tout .sql de ce dossier est exécuté au 1er démarrage (volume vide)
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"                    # accessible uniquement depuis ta machine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d persona"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:2.46.5                    # version figée
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy               # attend que Postgres soit prêt
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres               # nom du service = adresse réseau interne
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: persona
      DB_POSTGRESDB_SCHEMA: n8n                  # tables de N8N rangées à part de celles de Persona
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      NODE_FUNCTION_ALLOW_BUILTIN: crypto        # autorise 'crypto' dans les Code nodes (tokens)
      SMTP_FROM: ${SMTP_FROM}                    # expéditeur des mails, lu via {{ $env.SMTP_FROM }}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"      # autorise $env dans les expressions des nœuds
      # RGPD / minimisation : n8n ne garde pas les exécutions réussies (emails, messages, codes)
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all         # on garde les erreurs pour débugger...
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"  # ...et les tests lancés depuis l'éditeur
      EXECUTIONS_DATA_PRUNE: "true"              # ...mais tout est purgé automatiquement
      EXECUTIONS_DATA_MAX_AGE: 24                # au bout de 24 h (durée de conservation à documenter)
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  pgdata:
  n8n_data:
